<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PartyBox TV 🎉</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="tv-shell">
    <header class="tv-header">
      <div class="tv-brand">
        <div class="tv-logo">🎉</div>
        <div>
          <h1 class="tv-title">PartyBox</h1>
          <div style="color:var(--muted);font-size:0.95rem" id="tvSubtitle">Escaneie o QR Code no celular para entrar</div>
        </div>
      </div>

      <div class="tv-header-right">
        <div class="timer-pill hidden" id="tvTimer">00</div>
        <button class="btn" id="soundBtn" title="Som">🔊 Som</button>
        <button class="btn hidden" id="tvNextBtn">Avançar ⏭</button>
        <button class="btn hidden" id="tvLobbyBtn">🏠 Lobby</button>
      </div>
    </header>

    <main class="tv-stage" id="tvStage">
      <div class="stage-center">
        <p class="sub-msg">Conectando ao PartyBox…</p>
      </div>
    </main>
  </div>

  <script src="/tv.js"></script>
</body>
</html>
